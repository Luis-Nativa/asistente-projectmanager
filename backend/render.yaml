services:
  - type: web
    name: pendientes-telegram-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PIN_SALT_ROUNDS
        value: "12"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "1d"
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: "30d"
      - key: CRON_SECRET
        generateValue: true
      - key: TZ
        value: "America/Mexico_City"
      - key: PORT
        value: "8080"
    healthCheckPath: /health
    autoDeploy: true
