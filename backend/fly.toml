app = "pendientes-telegram"
primary_region = "qro"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TZ = "America/Mexico_City"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = "tcp"
  internal_port = 8080
  
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[jobs]]
  name = "cron-tick"
  schedule = "*/5 * * * *"
  command = "curl -X POST http://pendientes-telegram.internal:8080/internal/tick -H 'X-Cron-Secret: ${CRON_SECRET}'"
  region = "qro"
